name: Build PhoneAgent.exe
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ["PhoneAgent-PC/**", ".github/workflows/phoneagent.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: PhoneAgent-PC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller pyautogui pillow
      - name: Stamp version
        shell: pwsh
        run: '"VERSION = ''$($env:GITHUB_SHA.Substring(0,7))''" | Out-File -Encoding ascii version.py'
      - run: pyinstaller --noconfirm --onefile --windowed --name PhoneAgent --hidden-import pyautogui gui.py
      - name: Package (exe + adb)
        shell: pwsh
        run: |
          Invoke-WebRequest -UseBasicParsing 'https://dl.google.com/android/repository/platform-tools-latest-windows.zip' -OutFile pt.zip
          Expand-Archive -Force pt.zip dist
          Compress-Archive -Path dist\PhoneAgent.exe, dist\platform-tools -DestinationPath PhoneAgent-Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneAgent
          path: PhoneAgent-PC/PhoneAgent-Windows.zip
      - name: Publish to Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag --repo ${{ github.repository }} 2>$null
          gh release create latest PhoneAgent-Windows.zip dist\PhoneAgent.exe --repo ${{ github.repository }} --title "PhoneAgent (Windows, без Python)" --notes "Скачайте PhoneAgent-Windows.zip, распакуйте и запустите PhoneAgent.exe. Python не нужен. Дальше приложение обновляется само. build:$($env:GITHUB_SHA.Substring(0,7))"
